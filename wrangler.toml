name = "adminapps"
main = "src/worker.js"
compatibility_date = "2025-11-01"

# The Notion "Profiles Analytics" database the analytics section syncs from.
# The token itself is a secret: wrangler secret put NOTION_TOKEN
[vars]
NOTION_DATABASE_ID = "b7e294a6-9940-465e-9412-3dd7f1642780"

# Daily collection run. Fires only collectors an admin has switched to "auto",
# so this is a no-op until someone opts one in.
[triggers]
crons = ["0 12 * * *"]

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "adminapps"
database_id = "89101d86-aaab-482b-ba6f-235a758e01d1"

[observability]
enabled = true
