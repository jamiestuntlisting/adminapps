name: Deploy

# Publishes the Worker to Cloudflare. Needs a CLOUDFLARE_API_TOKEN repo
# secret with the "Edit Cloudflare Workers" permissions (plus D1 edit).
# CLOUDFLARE_ACCOUNT_ID is only required if the token can see more than
# one account.

on:
  push:
    branches:
      - main
      - claude/admin-apps-page-sorting-q9956b
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check the API token is present
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Apply D1 schema
        # CREATE TABLE IF NOT EXISTS throughout, so this is safe to re-run.
        run: npx wrangler d1 execute adminapps --remote --file=./schema.sql -y

      - name: Deploy Worker
        run: npx wrangler deploy
