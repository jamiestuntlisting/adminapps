name: Deploy

# Publishes the Worker to Cloudflare. Needs a CLOUDFLARE_API_TOKEN repo
# secret with the "Edit Cloudflare Workers" permissions.
# CLOUDFLARE_ACCOUNT_ID is only required if the token can see more than
# one account.
#
# This does NOT apply schema.sql: that goes through D1's import endpoint,
# which needs "D1 Edit" on the token. Apply schema changes with
# `npm run db:remote` from a machine logged in via `wrangler login`. If the
# token is given D1 Edit, this step can come back:
#   - name: Apply D1 schema
#     run: npx wrangler d1 execute adminapps --remote --file=./schema.sql -y

on:
  push:
    branches:
      - main
      - claude/admin-apps-page-sorting-q9956b
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check the API token is present
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Deploy Worker
        run: npx wrangler deploy
